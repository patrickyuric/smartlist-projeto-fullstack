<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart List - Login</title>

    <link rel="stylesheet" href="../assets/css/app.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

</head>

<body>

    <header class="boxTop">
        <img src="../assets/images/logo.png" alt="Smart List Logo">
        <h1>Smart List</h1>
    </header>

    <main class="container">
        <div class="form-group">
            <h2>Adicionar Item:</h2>
            <div class="input-list">
                <input type="text" id="itemInput" placeholder="Ex: Leite, Pão, Ovos..." />
                <button class="btn-add" onclick="adicionarItem()"><i class="bi bi-plus-lg"></i></button>
            </div>
        </div>

        <ul id="listaCompras" class="list-group">
            <!-- Lista de produtos será adicionada aqui -->
        </ul>

    </main>

    <footer>
        <p>Projeto Full Stack 3ºC - Desenvolvimento de Sistemas - 2026 </p>
    </footer>

    <script src="../assets/js/app.js"></script>
</body>

</html>
