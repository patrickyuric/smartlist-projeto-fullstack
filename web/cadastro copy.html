<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart List - Login</title>

    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

</head>

<body>

    <header class="boxTop">
        <img src="assets/images/logo.png" alt="Smart List Logo">
        <h1>Smart List</h1>
    </header>

    <main class="container">
        <h2>Novo Cadastro</h2>
        <div class="login">
            <form id="formCadastro">
                <div class="form-group">
                    <label for="nome">NOME <i class="bi bi-person-fill text-muted"></i></label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-MAIL <i class="bi bi-envelope-fill text-muted"></i></label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="email_confirm">CONFIRMAR E-MAIL <i class="bi bi-envelope-fill text-muted"></i></label>
                    <input type="email" id="email_confirm" name="email_confirm" required>
                </div>
                <div class="form-group">
                    <label for="password">SENHA <i class="bi bi-lock-fill text-muted"></i></label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="password_confirm">CONFIRMAR SENHA <i class="bi bi-lock-fill text-muted"></i></label>
                    <input type="password" id="password_confirm" name="password_confirm" required>
                </div>
                <div class="form-group">
                    <button type="submit">Salvar Cadastro</button>
                </div>
                <div class="form-group">
                    <button type="button" onclick="window.location.href='index.html'" class="btnSecondary">Retornar ao
                        Login</button>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>Projeto Full Stack 3ºC - Desenvolvimento de Sistemas - 2026 </p>
    </footer>

    <script src="assets/js/cadastro.js?v=2"></script>
</body>

</html>
